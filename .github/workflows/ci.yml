name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
  # Bot draft PRs are opened with GITHUB_TOKEN, which fires no pull_request
  # event; probe-ingest.yml dispatches CI on the branch instead.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: runtime/package-lock.json
      - name: Install pinned runtime dependencies
        run: npm ci --prefix runtime --ignore-scripts --no-audit --no-fund
      - name: Verify release version consistency
        run: node scripts/verify-release.mjs
      - name: Test all layers
        run: npm test
      - name: Build ad-hoc beta installer
        run: npm run build:macos
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: grokrouter-macos
          path: |
            build/grokrouter-*-macos.zip
            build/grokrouter-*-macos.zip.sha256
          if-no-files-found: error

  windows-packages:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            runtime/package-lock.json
            installer-windows/package-lock.json
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"
      - name: Install pinned runtime dependencies
        shell: bash
        run: npm ci --prefix runtime --ignore-scripts --no-audit --no-fund
      - name: Test Windows-portable layers
        shell: bash
        run: npm run test:runtime && npm run test:windows
      - name: Build x64 and Arm64 Windows packages
        shell: bash
        env:
          ROUTER_WINDOWS_REQUIRE_SETUP: "1"
        run: |
          npm run build:windows -- x64
          npm run build:windows -- arm64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: grokrouter-windows
          path: |
            build/grokrouter-*-windows-x64.zip
            build/grokrouter-*-windows-x64.zip.sha256
            build/grokrouter-*-windows-arm64.zip
            build/grokrouter-*-windows-arm64.zip.sha256
            build/grokrouter-*-windows-x64-setup.exe
            build/grokrouter-*-windows-x64-setup.exe.sha256
            build/grokrouter-*-windows-arm64-setup.exe
            build/grokrouter-*-windows-arm64-setup.exe.sha256
          if-no-files-found: error
      - name: Parse the Windows source installer
        shell: powershell
        run: |
          foreach ($shell in 'powershell', 'pwsh') {
            & $shell -NoProfile -Command {
              $tokens = $null; $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/install-windows.ps1').Path, [ref]$tokens, [ref]$errors)
              foreach ($problem in $errors) { Write-Host "install-windows.ps1:$($problem.Extent.StartLineNumber): $($problem.Message)" }
              exit $errors.Count
            }
            if ($LASTEXITCODE -ne 0) { throw "$shell could not parse scripts/install-windows.ps1" }
          }
      # Runs after the artifact upload because it rebuilds build/windows. No Grok
      # Bot is needed: the installer only builds, places, and links the app.
      - name: Install twice from the checkout with the Windows source installer
        shell: powershell
        env:
          GROKROUTER_NO_OPEN: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          $env:GROKROUTER_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'GrokRouter'
          $stale = Join-Path $env:RUNNER_TEMP 'GrokRouter.previous-19990101-000000'
          # A non-GrokRouter folder that merely shares the prefix must survive pruning.
          $foreign = Join-Path $env:RUNNER_TEMP 'GrokRouter.previous-user-notes'
          foreach ($pass in 1, 2) {
            if ($pass -eq 2) {
              New-Item -ItemType Directory -Path $stale, $foreign | Out-Null
              Set-Content -LiteralPath (Join-Path $stale 'GrokRouter.exe') -Value 'stale'
            }
            powershell -NoProfile -ExecutionPolicy Bypass -File scripts/install-windows.ps1
            if ($LASTEXITCODE -ne 0) { throw "install pass $pass failed" }
            if (-not (Test-Path -LiteralPath (Join-Path $env:GROKROUTER_INSTALL_DIR 'GrokRouter.exe') -PathType Leaf)) { throw "install pass $pass did not place GrokRouter.exe" }
          }
          if (-not (Test-Path -LiteralPath $foreign)) { throw 'pruning removed a folder that was not a GrokRouter install' }
          $backups = @(Get-ChildItem -LiteralPath $env:RUNNER_TEMP -Directory -Filter 'GrokRouter.previous-*' | Where-Object FullName -ne $foreign)
          if ($backups.Count -ne 1 -or $backups[0].FullName -eq $stale) { throw "expected only the newest previous install, found: $($backups.Name -join ', ')" }
          if (-not (Test-Path -LiteralPath (Join-Path $backups[0].FullName 'GrokRouter.exe') -PathType Leaf)) { throw 'the previous install was not preserved' }
          if (@(Get-ChildItem -LiteralPath $env:RUNNER_TEMP -Directory -Filter 'GrokRouter.installing-*').Count -ne 0) { throw 'a staging directory was left behind' }
          if (-not (Test-Path -LiteralPath (Join-Path ([Environment]::GetFolderPath('Programs')) 'GrokRouter.lnk'))) { throw 'the Start menu shortcut is missing' }
          $occupied = Join-Path $env:RUNNER_TEMP 'NotGrokRouter'
          New-Item -ItemType Directory -Path $occupied | Out-Null
          Set-Content -LiteralPath (Join-Path $occupied 'keep.txt') -Value 'user data'
          $env:GROKROUTER_INSTALL_DIR = $occupied
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/install-windows.ps1
          if ($LASTEXITCODE -eq 0) { throw 'the installer replaced a folder that was not a GrokRouter install' }
          if (-not (Test-Path -LiteralPath (Join-Path $occupied 'keep.txt'))) { throw 'the installer touched a folder that was not a GrokRouter install' }
